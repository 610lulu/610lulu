<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1020"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb7d5" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffb7d5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8c7e0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f8c7e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <g id="petalA">
      <path d="M0 0C6-10 18-10 24 0C18 10 6 10 0 0Z" fill="#ffb7d5"/>
      <path d="M2 0C7-7 17-7 22 0" stroke="#ffd9ea" stroke-opacity="0.55" stroke-width="1" fill="none"/>
    </g>
    <g id="petalB">
      <path d="M0 0C5-8 14-9 20 0C14 9 5 8 0 0Z" fill="#f4a6c1"/>
      <path d="M2 0C6-5 14-6 18 0" stroke="#ffe3ef" stroke-opacity="0.55" stroke-width="1" fill="none"/>
    </g>
  </defs>

  <rect width="1200" height="260" rx="24" fill="url(#bg)"/>
  <circle cx="170" cy="80" r="90" fill="url(#glow1)" filter="url(#blur)"/>
  <circle cx="980" cy="170" r="110" fill="url(#glow2)" filter="url(#blur)"/>
  <circle cx="760" cy="60" r="60" fill="url(#glow2)" filter="url(#blur)"/>

  <g opacity="0.95">
    <use href="#petalA" transform="translate(120 12) rotate(-18)">
      <animateTransform attributeName="transform" type="translate" values="120 -20; 160 285" dur="14s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="-18; 85; 210; 340" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.82;1" dur="14s" repeatCount="indefinite"/>
    </use>
    <use href="#petalB" transform="translate(300 0) rotate(10)">
      <animateTransform attributeName="transform" type="translate" values="300 -18; 250 278" dur="12s" begin="-3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="10; -70; -170; -320" dur="12s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.86;1" dur="12s" begin="-3s" repeatCount="indefinite"/>
    </use>
    <use href="#petalA" transform="translate(480 -8) rotate(35)">
      <animateTransform attributeName="transform" type="translate" values="480 -20; 520 280" dur="16s" begin="-6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="35; 120; 260; 420" dur="16s" begin="-6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.84;1" dur="16s" begin="-6s" repeatCount="indefinite"/>
    </use>
    <use href="#petalB" transform="translate(650 8) rotate(-25)">
      <animateTransform attributeName="transform" type="translate" values="650 -14; 610 282" dur="13s" begin="-1.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="-25; 65; 180; 300" dur="13s" begin="-1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.88;1" dur="13s" begin="-1.5s" repeatCount="indefinite"/>
    </use>
    <use href="#petalA" transform="translate(840 -12) rotate(12)">
      <animateTransform attributeName="transform" type="translate" values="840 -24; 890 280" dur="15s" begin="-5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="12; -40; -150; -280" dur="15s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.82;1" dur="15s" begin="-5s" repeatCount="indefinite"/>
    </use>
    <use href="#petalB" transform="translate(1040 4) rotate(-8)">
      <animateTransform attributeName="transform" type="translate" values="1040 -12; 1010 286" dur="11s" begin="-8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="-8; 70; 170; 310" dur="11s" begin="-8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.84;1" dur="11s" begin="-8s" repeatCount="indefinite"/>
    </use>
    <use href="#petalA" transform="translate(220 30) rotate(15) scale(0.8)">
      <animateTransform attributeName="transform" type="translate" values="220 -10; 250 270" dur="10s" begin="-4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="15; 90; 200; 340" dur="10s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.9;1" dur="10s" begin="-4s" repeatCount="indefinite"/>
    </use>
    <use href="#petalB" transform="translate(930 25) rotate(24) scale(0.75)">
      <animateTransform attributeName="transform" type="translate" values="930 -6; 960 266" dur="9s" begin="-2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="24; -35; -125; -240" dur="9s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.14;0.88;1" dur="9s" begin="-2s" repeatCount="indefinite"/>
    </use>
  </g>

  <g opacity="0.35">
    <path d="M0 205C130 180 230 175 340 188C452 201 566 232 700 225C880 215 984 160 1200 175" stroke="#f7b2ce" stroke-opacity="0.22" stroke-width="2" fill="none"/>
    <path d="M0 215C140 198 248 192 360 203C478 214 592 244 730 239C890 233 1030 190 1200 198" stroke="#ffd4e7" stroke-opacity="0.12" stroke-width="1" fill="none"/>
